  let calMonthOffset = 0; // 0 = current month, -1 = previous, …
  let logCollapsed = true; // Log panel folded by default (it gets long)
  let manualFormOpen = false;
  let manualProjectId = null; // which project is selected in the manual-entry form
  let manualPrefill = null;   // {projectId, date, start, end} seeding the manual form from a timeline gap
  let tickHandle = null;
  let lastTickMinute = -1;      // wall-clock minute of the last live timeline refresh
  let tlDragging = false;       // true while a Today-timeline block edge is being dragged
  let editingEntryId = null;   // log entry currently being edited inline
  let mergingTaskId = null;    // task whose inline "merge into…" row is open
  let collapsed = {};          // projectId -> true when its card is collapsed
  let doneCollapsed = {};      // projectId -> false when its "Done" group is expanded (folded by default)
  let dailyTargetHours = 0;    // 0 = no target set
  let lastTask = null;         // {projectId, taskId} last tracked, for "resume"
  let lastBackup = null;       // ISO timestamp of last export
  let theme = 'light';         // 'light' | 'dark'

  const root = document.getElementById('app-root');

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function storageGet(key){
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  }
  function storageSet(key, val){
    try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){ /* ignore */ }
  }

  function loadAll(){
    projects = storageGet('tk-projects') || [];
    tasks = storageGet('tk-tasks') || [];
    entries = storageGet('tk-entries') || [];
    activeTimer = storageGet('tk-active-timer') || null;
    collapsed = storageGet('tk-collapsed') || {};
    doneCollapsed = storageGet('tk-done-collapsed') || {};
    { const lc = storageGet('tk-log-collapsed'); logCollapsed = (lc === null ? true : lc); }
    dailyTargetHours = storageGet('tk-daily-target') || 0;
    lastTask = storageGet('tk-last-task') || null;
    lastBackup = storageGet('tk-last-backup') || null;
    theme = storageGet('tk-theme') || (prefersDark() ? 'dark' : 'light');
    applyTheme();
    migrateToTasks();
    guardStaleTimer();
    render();
    updateTitle();
    if (activeTimer) startTicking();
    document.addEventListener('keydown', onKeydown);
    if (typeof window !== 'undefined') window.addEventListener('beforeunload', onBeforeUnload);
  }

  function prefersDark(){
    return typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function applyTheme(){ if (root) root.setAttribute('data-theme', theme); }
  function toggleTheme(){
    theme = theme === 'dark' ? 'light' : 'dark';
    storageSet('tk-theme', theme);
    applyTheme();
    render();
  }

  // Data is already saved on every change, but warn before leaving while a
  // timer is still running so it isn't left tracking by accident.
  function onBeforeUnload(ev){
    if (activeTimer){ ev.preventDefault(); ev.returnValue = ''; return ''; }
  }

  // If a timer has been left running for a very long time (>= 8h) or across a
  // day boundary, the user most likely forgot to stop it. Ask what to log
  // instead of silently counting the whole stretch.
  function guardStaleTimer(){
    if (!activeTimer) return;
    const start = new Date(activeTimer.start);
    const elapsedH = (Date.now() - start) / 3600000;
    const crossedDay = startOfDay(new Date()).getTime() !== startOfDay(start).getTime();
    if (elapsedH < 8 && !crossedDay) return;
    const p = projects.find(pr => pr.id === activeTimer.projectId);
    const t = tasks.find(tk => tk.id === activeTimer.taskId);
    const name = [p && p.name, t && t.name].filter(Boolean).join(' · ') || 'a task';
    const ans = prompt(
      'A timer for "' + name + '" has been running since ' + start.toLocaleString(undefined, { hour12: false }) +
      ' (' + Math.floor(elapsedH) + 'h). You may have forgotten to stop it.\n\n' +
      'How many hours should we log for this session?\n' +
      '(0 or blank = discard it · Cancel = keep it running)', '1');
    if (ans === null) return; // keep running
    const hrs = parseFloat(ans);
    if (hrs && hrs > 0){
      const end = new Date(start.getTime() + hrs * 3600000);
      entries.push({ id: uid(), projectId: activeTimer.projectId, taskId: activeTimer.taskId, start: activeTimer.start, end: end.toISOString(), note: '(auto: forgot to stop)' });
      storageSet('tk-entries', entries);
    }
    activeTimer = null;
    storageSet('tk-active-timer', null);
  }

  function onKeydown(ev){
    const tag = (ev.target && ev.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    if (ev.key === 'Escape' && activeTimer){ ev.preventDefault(); stopTimer(); }
  }

  function updateTitle(){
    if (activeTimer){
      const elapsed = (Date.now() - new Date(activeTimer.start)) / 1000;
      const t = tasks.find(tk => tk.id === activeTimer.taskId);
      document.title = '▶ ' + fmtHMS(elapsed) + (t ? ' · ' + t.name : '');
    } else {
      document.title = 'Timekeeper';
    }
  }

  // Older data tracked time against projects only (no taskId). For any project
  // that has entries/timer but no task, create a "General" task and attach the
  // orphaned records to it, so nothing that was already tracked is lost.
  function migrateToTasks(){
    let changed = false;
    const generalFor = {}; // projectId -> task id
    function ensureGeneral(projectId){
      if (generalFor[projectId]) return generalFor[projectId];
      let t = tasks.find(tk => tk.projectId === projectId && tk.name === 'General');
      if (!t){ t = { id: uid(), projectId, name: 'General' }; tasks.push(t); changed = true; }
      generalFor[projectId] = t.id;
      return t.id;
    }
    entries.forEach(e => {
      if (!e.taskId && e.projectId){ e.taskId = ensureGeneral(e.projectId); changed = true; }
    });
    if (activeTimer && !activeTimer.taskId && activeTimer.projectId){
      activeTimer.taskId = ensureGeneral(activeTimer.projectId);
      storageSet('tk-active-timer', activeTimer);
    }
    if (changed){ storageSet('tk-tasks', tasks); storageSet('tk-entries', entries); }
  }

  function fmtHMS(totalSeconds){
    const h = Math.floor(totalSeconds/3600);
    const m = Math.floor((totalSeconds%3600)/60);
    const s = Math.floor(totalSeconds%60);
    return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':');
  }
  function fmtHM(totalSeconds){
    const h = Math.floor(totalSeconds/3600);
    const m = Math.round((totalSeconds%3600)/60);
    return h + 'h ' + String(m).padStart(2,'0') + 'm';
  }
  function startOfWeek(d){
    const dt = new Date(d); const day = (dt.getDay()+6)%7; // Monday=0
    dt.setHours(0,0,0,0); dt.setDate(dt.getDate()-day); return dt;
  }
  function startOfDay(d){ const dt = new Date(d); dt.setHours(0,0,0,0); return dt; }
  function startOfMonth(d){ const dt = new Date(d); dt.setHours(0,0,0,0); dt.setDate(1); return dt; }
  function fmtDateInput(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function fmtTimeInput(d){ return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }

  function durationOf(entry){
    return Math.max(0, (new Date(entry.end) - new Date(entry.start))/1000);
  }

  function entriesForPeriod(period){
    const now = new Date();
    let from = null;
    if (period === 'today') from = startOfDay(now);
    else if (period === 'week') from = startOfWeek(now);
    else if (period === 'month') from = startOfMonth(now);
    return entries.filter(e => !from || new Date(e.end) >= from);
  }

  function startTimer(projectId, taskId){
    if (!projectId || !taskId) return;
    if (activeTimer) stopTimer(true); // switching tasks pauses the previous one
    activeTimer = { projectId, taskId, start: new Date().toISOString() };
    lastTask = { projectId, taskId };
    storageSet('tk-active-timer', activeTimer);
    storageSet('tk-last-task', lastTask);
    startTicking();
    updateTitle();
    render();
  }
  function stopTimer(skipRender){
    if (!activeTimer) return;
    const entry = { id: uid(), projectId: activeTimer.projectId, taskId: activeTimer.taskId, start: activeTimer.start, end: new Date().toISOString(), note: '' };
    if (durationOf(entry) >= 5) entries.push(entry); // ignore accidental sub-5s taps
    activeTimer = null;
    stopTicking();
    storageSet('tk-entries', entries);
    storageSet('tk-active-timer', null);
    updateTitle();
    if (!skipRender) render();
  }
  function startTicking(){
    stopTicking();
    lastTickMinute = Math.floor(Date.now() / 60000); // refresh at the next minute boundary, not 1s in
    tickHandle = setInterval(updateDialOnly, 1000);
  }
  function stopTicking(){
    if (tickHandle) clearInterval(tickHandle);
    tickHandle = null;
  }

  function addProject(name, color){
    name = name.trim();
    if (!name) return;
    color = color || PALETTE[projects.length % PALETTE.length];
    const proj = { id: uid(), name, color };
    projects.push(proj);
    storageSet('tk-projects', projects);
    render();
  }
  function setProjectColor(id, color){
    const p = projects.find(pr => pr.id === id);
    if (!p || !color) return;
    p.color = color;
    storageSet('tk-projects', projects);
    render();
  }
  function nextColor(){ return PALETTE[projects.length % PALETTE.length]; }
  function addTask(projectId, name){
    name = name.trim();
    if (!projectId || !name) return;
    tasks.push({ id: uid(), projectId, name });
    storageSet('tk-tasks', tasks);
    render();
  }
  function deleteProject(id){
    const p = projects.find(pr => pr.id === id);
    if (!confirm('Delete project "' + (p ? p.name : '') + '" and its tasks? Logged time is kept in the history.')) return;
    if (activeTimer && activeTimer.projectId === id) stopTimer(true);
    projects = projects.filter(pr => pr.id !== id);
    tasks = tasks.filter(t => t.projectId !== id);
    storageSet('tk-projects', projects);
    storageSet('tk-tasks', tasks);
    render();
  }
  function deleteTask(id){
    const t = tasks.find(tk => tk.id === id);
    if (!confirm('Delete task "' + (t ? t.name : '') + '"? Logged time is kept in the history.')) return;
    if (activeTimer && activeTimer.taskId === id) stopTimer(true);
    tasks = tasks.filter(tk => tk.id !== id);
    if (mergingTaskId === id) mergingTaskId = null;
    storageSet('tk-tasks', tasks);
    render();
  }
  // Mark a task finished (done=true) or reopen it (done cleared). A finished
  // task keeps its name and history but leaves the startable list, dropping into
  // the project's foldable "Done" group. Finishing the running task stops it.
  function setTaskDone(id, done){
    const t = tasks.find(tk => tk.id === id); if (!t) return;
    if (done){
      if (activeTimer && activeTimer.taskId === id) stopTimer(true);
      t.done = true;
      if (mergingTaskId === id) mergingTaskId = null;
    } else {
      delete t.done;
    }
    storageSet('tk-tasks', tasks);
    render();
  }
  function toggleDoneGroup(projectId){
    const folded = doneCollapsed[projectId] !== false; // undefined/true = folded (default)
    doneCollapsed[projectId] = folded ? false : true;  // expand if folded, else fold
    storageSet('tk-done-collapsed', doneCollapsed); render();
  }
  // Fold one task into another in the same project: all its logged time is
  // re-tagged to the target, then the emptied task is removed. No time is lost.
  function mergeTask(fromId, intoId){
    const from = tasks.find(tk => tk.id === fromId);
    const into = tasks.find(tk => tk.id === intoId);
    if (!from || !into || from.id === into.id || from.projectId !== into.projectId) return;
    const moved = entries.filter(e => e.taskId === fromId).length;
    if (!confirm('Move ' + moved + ' logged ' + (moved === 1 ? 'entry' : 'entries') + ' from "' + from.name + '" into "' + into.name + '", then delete "' + from.name + '"?')) return;
    entries.forEach(e => { if (e.taskId === fromId) e.taskId = intoId; });
    if (activeTimer && activeTimer.taskId === fromId){
      activeTimer.taskId = intoId;
      storageSet('tk-active-timer', activeTimer);
    }
    if (lastTask && lastTask.taskId === fromId){
      lastTask.taskId = intoId;
      storageSet('tk-last-task', lastTask);
    }
    tasks = tasks.filter(tk => tk.id !== fromId);
    mergingTaskId = null;
    storageSet('tk-entries', entries);
    storageSet('tk-tasks', tasks);
    render();
  }
  function renameProject(id){
    const p = projects.find(pr => pr.id === id); if (!p) return;
    const name = prompt('Rename project', p.name);
    if (name === null) return;
    const n = name.trim(); if (!n) return;
    p.name = n; storageSet('tk-projects', projects); render();
  }
  function renameTask(id){
    const t = tasks.find(tk => tk.id === id); if (!t) return;
    const name = prompt('Rename task', t.name);
    if (name === null) return;
    const n = name.trim(); if (!n) return;
    t.name = n; storageSet('tk-tasks', tasks); render();
  }
  function moveProject(id, dir){
    const i = projects.findIndex(p => p.id === id); if (i < 0) return;
    const j = i + dir; if (j < 0 || j >= projects.length) return;
    const tmp = projects[i]; projects[i] = projects[j]; projects[j] = tmp;
    storageSet('tk-projects', projects); render();
  }
  // Reorder a task among its siblings: swap it with the neighbouring task of
  // the same project, keeping the flat tasks array otherwise untouched.
  function moveTask(id, dir){
    const t = tasks.find(tk => tk.id === id); if (!t) return;
    const sibs = tasks.filter(tk => tk.projectId === t.projectId && !tk.done);
    const si = sibs.findIndex(tk => tk.id === id);
    const sj = si + dir; if (sj < 0 || sj >= sibs.length) return;
    const i = tasks.indexOf(sibs[si]), j = tasks.indexOf(sibs[sj]);
    const tmp = tasks[i]; tasks[i] = tasks[j]; tasks[j] = tmp;
    storageSet('tk-tasks', tasks); render();
  }
  function toggleCollapse(id){
    collapsed[id] = !collapsed[id];
    storageSet('tk-collapsed', collapsed); render();
  }
  function toggleLog(){
    logCollapsed = !logCollapsed;
    storageSet('tk-log-collapsed', logCollapsed); render();
  }
  function shiftMonth(delta){ calMonthOffset += delta; render(); }
  function setDailyTarget(hours){
    dailyTargetHours = (hours && hours > 0) ? hours : 0;
    storageSet('tk-daily-target', dailyTargetHours); render();
  }
  function deleteEntry(id){
    entries = entries.filter(e => e.id !== id);
    if (editingEntryId === id) editingEntryId = null;
    storageSet('tk-entries', entries);
    render();
  }
  function updateEntry(id, dateStr, startStr, endStr, note){
    const e = entries.find(x => x.id === id); if (!e) return;
    if (!dateStr || !startStr || !endStr){ alert('Date, start and end are all required.'); return; }
    const start = new Date(dateStr + 'T' + startStr);
    const end = new Date(dateStr + 'T' + endStr);
    if (end <= start){ alert('End time must be after start time.'); return; }
    e.start = start.toISOString(); e.end = end.toISOString(); e.note = note || '';
    editingEntryId = null;
    storageSet('tk-entries', entries);
    render();
  }
  function addManualEntry(projectId, taskId, dateStr, startStr, endStr, note){
    if (!projectId || !taskId || !dateStr || !startStr || !endStr) return;
    const start = new Date(dateStr + 'T' + startStr);
    let end = new Date(dateStr + 'T' + endStr);
    if (end <= start) return;
    entries.push({ id: uid(), projectId, taskId, start: start.toISOString(), end: end.toISOString(), note: note||'' });
    storageSet('tk-entries', entries);
    manualFormOpen = false;
    manualPrefill = null;
    render();
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  function markBackup(){
    lastBackup = new Date().toISOString();
    storageSet('tk-last-backup', lastBackup);
  }
  function exportData(){
    const payload = { version: 1, exportedAt: new Date().toISOString(), projects, tasks, entries };
    downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }),
      'timekeeper-backup-' + new Date().toISOString().slice(0,10) + '.json');
    markBackup(); render();
  }
  function csvCell(v){ v = String(v == null ? '' : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
  function exportCSV(){
    const rows = [['Project','Task','Date','Start','End','Hours','Note']];
    [...entries].sort((a,b) => new Date(a.start) - new Date(b.start)).forEach(e => {
      const p = projects.find(pr => pr.id === e.projectId);
      const t = tasks.find(tk => tk.id === e.taskId);
      const s = new Date(e.start), en = new Date(e.end);
      rows.push([
        p ? p.name : '(deleted project)', t ? t.name : '(deleted task)',
        s.toLocaleDateString(), s.toLocaleTimeString([], { hour12: false }), en.toLocaleTimeString([], { hour12: false }),
        (durationOf(e)/3600).toFixed(2), e.note || ''
      ]);
    });
    const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
    downloadBlob(new Blob([csv], { type: 'text/csv' }), 'timekeeper-' + new Date().toISOString().slice(0,10) + '.csv');
    markBackup(); render();
  }
  function backupAge(){
    if (!lastBackup) return { text: 'No backup yet — export now to be safe.', stale: true };
    const days = Math.floor((Date.now() - new Date(lastBackup)) / 86400000);
    const when = days <= 0 ? 'today' : (days + ' day' + (days > 1 ? 's' : '') + ' ago');
    return { text: 'Last backup: ' + when, stale: days >= 7 };
  }
  function importData(file){
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try { data = JSON.parse(reader.result); } catch(e){ alert('That file is not valid JSON.'); return; }
      if (!data || !Array.isArray(data.projects) || !Array.isArray(data.tasks) || !Array.isArray(data.entries)){
        alert('This does not look like a Timekeeper backup (missing projects/tasks/entries).');
        return;
      }
      if (!confirm('Replace ALL current data with the contents of this backup? This cannot be undone.')) return;
      if (activeTimer) stopTimer(true);
      projects = data.projects; tasks = data.tasks; entries = data.entries;
      storageSet('tk-projects', projects);
      storageSet('tk-tasks', tasks);
      storageSet('tk-entries', entries);
      migrateToTasks();
      render();
    };
    reader.readAsText(file);
  }

  function updateDialOnly(){
    const dial = document.getElementById('tk-dial-progress');
    const readout = document.getElementById('tk-dial-readout');
    if (!dial || !activeTimer) return;
    const elapsed = (Date.now() - new Date(activeTimer.start))/1000;
    const circumference = 2 * Math.PI * 58;
    dial.style.strokeDashoffset = circumference * (1 - (elapsed % 3600)/3600);
    if (readout) readout.textContent = fmtHMS(elapsed);
    const hoursEl = document.getElementById('tk-dial-hours');
    if (hoursEl){
      const doneHours = Math.floor(elapsed / 3600);
      if (hoursEl.children.length !== doneHours){
        hoursEl.innerHTML = doneHours ? Array.from({ length: doneHours }, () => '<span class="tk-dial-pip"></span>').join('') : '';
        hoursEl.title = doneHours ? doneHours + ' h this session' : '';
      }
    }
    updateTitle();
    // Grow the timelines live: rebuild once per minute so the running task's
    // block and the now-line advance without waiting for the timer to stop.
    // Skip the rebuild while a field is focused so it never clobbers an
    // in-progress rename or inline log edit.
    const minute = Math.floor(Date.now() / 60000);
    if (minute !== lastTickMinute){
      lastTickMinute = minute;
      const ae = document.activeElement;
      const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT' || ae.isContentEditable);
      if (!typing && !tlDragging) render();
    }
  }

  function render(){
    const today = new Date();
    const dateStr = today.toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });

    // dial initial state — the ring fills over the current HOUR of the session
    // (elapsed within this hour), not a per-minute seconds sweep; one pip below
    // lights per completed hour so the magnitude is glanceable.
    const circumference = 2 * Math.PI * 58;
    let elapsed = 0;
    if (activeTimer) elapsed = (Date.now() - new Date(activeTimer.start))/1000;
    const hourFrac = (elapsed % 3600) / 3600;
    const dialOffset = circumference * (1 - hourFrac);
    const doneHours = Math.floor(elapsed / 3600);
    const pipsHtml = doneHours ? Array.from({ length: doneHours }, () => '<span class="tk-dial-pip"></span>').join('') : '';

    // today's tracked seconds per task (incl. the live timer)
    const todayFrom = startOfDay(new Date());
    const weekFrom = startOfWeek(new Date());
    const monthFrom = startOfMonth(new Date());
    const todaySecByTask = {};
    let weekTotalSec = 0, monthTotalSec = 0;
    entries.forEach(e => {
      if (new Date(e.end) >= todayFrom) todaySecByTask[e.taskId] = (todaySecByTask[e.taskId]||0) + durationOf(e);
      if (new Date(e.end) >= weekFrom) weekTotalSec += durationOf(e);
      if (new Date(e.end) >= monthFrom) monthTotalSec += durationOf(e);
    });
    if (activeTimer){
      const live = (Date.now() - new Date(activeTimer.start))/1000;
      todaySecByTask[activeTimer.taskId] = (todaySecByTask[activeTimer.taskId]||0) + live;
      weekTotalSec += live;
      monthTotalSec += live;
    }
    const todayTotalSec = Object.values(todaySecByTask).reduce((s,v) => s + v, 0);
    const targetSec = dailyTargetHours * 3600;
    const targetPct = targetSec ? Math.min(100, todayTotalSec/targetSec*100) : 0;

    // resume target: the last task tracked, if it still exists
    const resume = (!activeTimer && lastTask && projects.some(p => p.id === lastTask.projectId) && tasks.some(t => t.id === lastTask.taskId)) ? lastTask : null;
    const resumeName = resume ? (tasks.find(t => t.id === resume.taskId) || {}).name : '';

    // the running task, called out beside the dial; plus a glanceable today/week/target gauge
    let nowTaskHtml = '';
    if (activeTimer){
      const ap = projects.find(pr => pr.id === activeTimer.projectId);
      const at = tasks.find(tk => tk.id === activeTimer.taskId);
      const since = new Date(activeTimer.start).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      nowTaskHtml = `<div class="tk-now-task"><span class="tk-dot" style="background:${ap ? ap.color : 'var(--accent)'}"></span>${escapeHtml([ap && ap.name, at && at.name].filter(Boolean).join(' · '))}</div>
        <div class="tk-now-since">since ${since}</div>`;
    }
    const gaugeHtml = `<div class="tk-now-gauge">
      <div class="tk-gauge-nums"><b>${fmtHM(todayTotalSec)}</b> today · <b>${fmtHM(weekTotalSec)}</b> this week</div>
      ${targetSec
        ? `<div class="tk-gauge-track"><div class="tk-gauge-fill" style="width:${targetPct}%;background:${targetPct>=100?'#6B8E4E':'var(--accent)'}"></div></div>
           <div class="tk-gauge-cap">${Math.round(targetPct)}% of ${dailyTargetHours}h target</div>`
        : ''}
    </div>`;

    // per-task colour: a stable shade of the parent project's colour
    const taskShadeById = {};
    projects.forEach(p => {
      const pts = tasks.filter(t => t.projectId === p.id);
      pts.forEach((t, i) => { taskShadeById[t.id] = taskShade(p.color, i, pts.length); });
    });

    // --- Projects & tasks list ---
    const projectCards = projects.length ? projects.map((p, idx) => {
      const isCollapsed = !!collapsed[p.id];
      const myTasks = tasks.filter(t => t.projectId === p.id);
      const projTodaySec = myTasks.reduce((s,t) => s + (todaySecByTask[t.id]||0), 0);
      const activeTasks = myTasks.filter(t => !t.done);
      const doneTasks = myTasks.filter(t => t.done);
      const taskRows = activeTasks.length ? activeTasks.map((t, ti) => {
        const running = activeTimer && activeTimer.taskId === t.id;
        const todaySec = todaySecByTask[t.id] || 0;
        if (mergingTaskId === t.id){
          const siblings = activeTasks.filter(o => o.id !== t.id);
          return `<div class="tk-merge-row">
            <span class="tk-merge-label">Merge <b>${escapeHtml(t.name)}</b> into</span>
            <select class="tk-input" id="tk-merge-target">${siblings.map(o => `<option value="${o.id}">${escapeHtml(o.name)}</option>`).join('')}</select>
            <button class="tk-btn tk-btn-start tk-btn-small" data-merge-confirm="${t.id}">Merge</button>
            <button class="tk-btn tk-btn-ghost tk-btn-small" data-merge-cancel="1">Cancel</button>
          </div>`;
        }
        return `<div class="tk-task-row ${running?'running':''}">
          <span class="tk-task-name" data-rename-task="${t.id}" title="Click to rename">${escapeHtml(t.name)}</span>
          <span class="tk-task-today">${todaySec ? fmtHM(todaySec) : ''}</span>
          ${running
            ? `<button class="tk-btn tk-btn-stop tk-btn-small" data-stop-task="1">Stop</button>`
            : `<button class="tk-btn tk-btn-start tk-btn-small" data-start-project="${p.id}" data-start-task="${t.id}">Start</button>`}
          <span class="tk-task-actions">
            <button class="tk-icon-btn" data-finish-task="${t.id}" title="Mark finished">✓</button>
            ${activeTasks.length > 1 ? `
              <button class="tk-icon-btn" data-move-task="${t.id}" data-dir="-1" title="Move up" ${ti===0?'disabled':''}>▲</button>
              <button class="tk-icon-btn" data-move-task="${t.id}" data-dir="1" title="Move down" ${ti===activeTasks.length-1?'disabled':''}>▼</button>
              <button class="tk-log-del" data-merge-task="${t.id}" title="Merge into another task">⤵</button>` : ''}
            <button class="tk-log-del" data-del-task="${t.id}" title="Delete task">✕</button>
          </span>
        </div>`;
      }).join('') : (myTasks.length ? '' : `<div class="tk-empty" style="padding:4px 0;">No tasks yet — add one below.</div>`);
      const doneFolded = doneCollapsed[p.id] !== false; // folded by default
      const doneBlock = doneTasks.length ? `
        <div class="tk-done-group">
          <button class="tk-done-head" data-done-group="${p.id}" title="${doneFolded?'Show':'Hide'} finished tasks"><span class="tk-caret-inline">${doneFolded?'▸':'▾'}</span> Done (${doneTasks.length})</button>
          ${doneFolded ? '' : doneTasks.map(t => {
            const dTodaySec = todaySecByTask[t.id] || 0;
            return `<div class="tk-task-row done">
              <span class="tk-task-name" data-rename-task="${t.id}" title="Click to rename">${escapeHtml(t.name)}</span>
              <span class="tk-task-today">${dTodaySec ? fmtHM(dTodaySec) : ''}</span>
              <button class="tk-btn tk-btn-ghost tk-btn-small" data-reopen-task="${t.id}" title="Reopen this task">Reopen</button>
              <span class="tk-task-actions">
                <button class="tk-log-del" data-del-task="${t.id}" title="Delete task">✕</button>
              </span>
            </div>`;
          }).join('')}
        </div>` : '';
      const body = isCollapsed ? '' : `
        ${taskRows}
        ${doneBlock}
        <div class="tk-add-row">
          <input class="tk-input" data-new-task="${p.id}" placeholder="New task (e.g. Meetings)"/>
          <button class="tk-btn tk-btn-ghost tk-btn-small" data-add-task="${p.id}">Add task</button>
        </div>`;
      return `<div class="tk-proj-card" style="border-left:3px solid ${p.color}">
        <div class="tk-proj-head">
          <div class="tk-proj-title">
            <button class="tk-caret" data-collapse="${p.id}" title="${isCollapsed?'Expand':'Collapse'}">${isCollapsed?'▸':'▾'}</button>
            <label class="tk-dot-pick" title="Change colour">
              <span class="tk-dot" style="background:${p.color}"></span>
              <input type="color" value="${p.color}" data-color-project="${p.id}"/>
            </label>
            <span data-rename-project="${p.id}" title="Click to rename">${escapeHtml(p.name)}</span>
            ${isCollapsed && projTodaySec ? `<span class="tk-task-today" style="font-weight:400;">${fmtHM(projTodaySec)}</span>` : ''}
          </div>
          <div class="tk-proj-actions">
            <button class="tk-icon-btn" data-move-project="${p.id}" data-dir="-1" title="Move up" ${idx===0?'disabled':''}>▲</button>
            <button class="tk-icon-btn" data-move-project="${p.id}" data-dir="1" title="Move down" ${idx===projects.length-1?'disabled':''}>▼</button>
            <button class="tk-log-del" data-del-project="${p.id}" title="Delete project">✕</button>
          </div>
        </div>
        ${body}
      </div>`;
    }).join('') : `<div class="tk-empty">No projects yet — add one above to start tracking.</div>`;

    // --- Today summary (grouped project -> task) ---
    const todayGroups = projects.map(p => {
      const rows = tasks.filter(t => t.projectId === p.id && todaySecByTask[t.id])
        .sort((a,b) => todaySecByTask[b.id]-todaySecByTask[a.id])
        .map(t => `<div class="tk-sum-task"><span class="tk-sum-taskname"><span class="tk-dot tk-dot-sm" style="background:${taskShadeById[t.id] || p.color}"></span>${escapeHtml(t.name)}</span><span class="tk-log-dur">${fmtHM(todaySecByTask[t.id])}</span></div>`).join('');
      if (!rows) return '';
      const total = tasks.filter(t => t.projectId === p.id).reduce((s,t) => s + (todaySecByTask[t.id]||0), 0);
      return `<div class="tk-sum-group">
        <div class="tk-sum-head"><span class="tk-bar-label"><span class="tk-dot" style="background:${p.color}"></span>${escapeHtml(p.name)}</span><span class="tk-log-dur">${fmtHM(total)}</span></div>
        ${rows}
      </div>`;
    }).join('');
    const todaySummary = todayGroups || `<div class="tk-empty">No time on the clock yet today. Press Start on a task to begin.</div>`;

    // --- Today's timeline (a lane per project across the hours of the day) ---
    const HOUR = 3600000;
    const dayStartMs = todayFrom.getTime();
    const nowMs = Date.now();
    const segsByProject = {}; // projectId -> [{s, e, taskId}] (clamped to today)
    let minMs = Infinity, maxMs = -Infinity;
    function addSeg(projectId, taskId, startMs, endMs, entryId){
      const s = Math.max(startMs, dayStartMs);
      if (endMs <= s) return;
      (segsByProject[projectId] = segsByProject[projectId] || []).push({ s, e: endMs, taskId, entryId });
      if (s < minMs) minMs = s;
      if (endMs > maxMs) maxMs = endMs;
    }
    entries.forEach(en => {
      const endMs = new Date(en.end).getTime();
      if (endMs >= dayStartMs) addSeg(en.projectId, en.taskId, new Date(en.start).getTime(), endMs, en.id);
    });
    if (activeTimer) addSeg(activeTimer.projectId, activeTimer.taskId, new Date(activeTimer.start).getTime(), nowMs);

    let timeline;
    if (maxMs < 0){
      timeline = `<div class="tk-empty">Your day's timeline fills in here once the clock is running.</div>`;
    } else {
      const rangeStart = Math.min(dayStartMs + DAY_VIEW_START_HOUR * HOUR, Math.floor(minMs / HOUR) * HOUR);
      let rangeEnd = Math.max(dayStartMs + DAY_VIEW_END_HOUR * HOUR, Math.ceil(maxMs / HOUR) * HOUR);
      if (rangeEnd <= rangeStart) rangeEnd = rangeStart + HOUR;
      const span = rangeEnd - rangeStart;
      const pct = ms => ((ms - rangeStart) / span) * 100;
      const hhmm = ms => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

      let ticks = '';
      for (let t = rangeStart; t <= rangeEnd; t += HOUR){
        ticks += `<div class="tk-tl-tick" style="left:${pct(t)}%"><span>${hhmm(t)}</span></div>`;
      }
      const nowMarker = (nowMs >= rangeStart && nowMs <= rangeEnd)
        ? `<div class="tk-tl-now" style="left:${pct(nowMs)}%" title="now"></div>` : '';

      const lanes = projects.filter(p => segsByProject[p.id]).map(p => {
        const segs = segsByProject[p.id];
        const total = segs.reduce((s, seg) => s + (seg.e - seg.s) / 1000, 0);
        const blocks = segs.map(seg => {
          const t = tasks.find(tk => tk.id === seg.taskId);
          const isEntry = !!seg.entryId; // running-timer segment has no entryId: shown, but not draggable
          const tip = (t ? t.name : '(task)') + ' · ' + hhmm(seg.s) + '–' + hhmm(seg.e) + ' (' + fmtHM((seg.e - seg.s) / 1000) + ')' + (isEntry ? ' · click to edit, drag edges to adjust' : '');
          const w = Math.max(pct(seg.e) - pct(seg.s), 0.5);
          // data-start/data-end on every block feed collision + hole detection; only entries carry pid/tid + handles
          const attrs = isEntry
            ? ` data-entry="${seg.entryId}" data-start="${seg.s}" data-end="${seg.e}" data-pid="${p.id}" data-tid="${seg.taskId}"`
            : ` data-start="${seg.s}" data-end="${seg.e}"`;
          const handles = isEntry ? '<span class="tk-tl-handle tk-tl-handle-l"></span><span class="tk-tl-handle tk-tl-handle-r"></span>' : '';
          return `<div class="tk-tl-block${isEntry ? ' tk-tl-entry' : ''}"${attrs} style="left:${pct(seg.s)}%;width:${w}%;background:${taskShadeById[seg.taskId] || p.color}" title="${escapeHtml(tip)}">${handles}</div>`;
        }).join('');
        return `<div class="tk-tl-row">
          <div class="tk-tl-label"><span class="tk-dot" style="background:${p.color}"></span><span class="tk-tl-name">${escapeHtml(p.name)}</span><span class="tk-tl-total">${fmtHM(total)}</span></div>
          <div class="tk-tl-track" data-lane="${p.id}" data-range-start="${rangeStart}" data-span="${span}">${blocks}${nowMarker}</div>
        </div>`;
      }).join('');

      timeline = `<div class="tk-tl" id="tk-today-tl">
        ${lanes}
        <div class="tk-tl-row tk-tl-axis"><div class="tk-tl-label"></div><div class="tk-tl-track">${ticks}</div></div>
      </div>`;
    }

    // --- Recent days (multi-day timeline: one row per day, coloured by project) ---
    // Collect segments per day (local-day key), clamped to that day's midnight
    // bounds so an entry crossing midnight is split across two day rows.
    const MIN = 60000;
    const segsByDay = {}; // dayStartMs -> [{startMin, endMin, projectId, taskId}]
    let dMin = Infinity, dMax = -Infinity;
    function addDaySeg(startMs, endMs, projectId, taskId){
      let s = startMs;
      while (s < endMs){
        const dayStart = startOfDay(new Date(s)).getTime();
        const dayEnd = dayStart + 86400000;
        const segEnd = Math.min(endMs, dayEnd);
        const startMin = (s - dayStart) / MIN;
        const endMin = (segEnd - dayStart) / MIN;
        (segsByDay[dayStart] = segsByDay[dayStart] || []).push({ startMin, endMin, projectId, taskId });
        if (startMin < dMin) dMin = startMin;
        if (endMin > dMax) dMax = endMin;
        s = segEnd;
      }
    }
    const rangeFromMs = daysRange === 'week'
      ? startOfWeek(new Date()).getTime()  // this week = from Monday, matching the week gauge
      : startOfDay(new Date(Date.now() - (daysRange - 1) * 86400000)).getTime();
    entries.forEach(en => {
      const startMs = new Date(en.start).getTime(), endMs = new Date(en.end).getTime();
      if (endMs > rangeFromMs && endMs > startMs) addDaySeg(Math.max(startMs, rangeFromMs), endMs, en.projectId, en.taskId);
    });
    if (activeTimer){
      const startMs = new Date(activeTimer.start).getTime();
      if (Date.now() > rangeFromMs) addDaySeg(Math.max(startMs, rangeFromMs), Date.now(), activeTimer.projectId, activeTimer.taskId);
    }

    let multiDay;
    const dayKeys = Object.keys(segsByDay).map(Number).sort((a,b) => b - a); // most recent first
    if (!dayKeys.length){
      multiDay = `<div class="tk-empty">No time tracked ${daysRange === 'week' ? 'this week' : 'in the last ' + daysRange + ' days'}.</div>`;
    } else {
      const rmStart = Math.min(DAY_VIEW_START_HOUR * 60, Math.floor(dMin / 60) * 60);  // whole-hour bounds (minutes)
      let rmEnd = Math.max(DAY_VIEW_END_HOUR * 60, Math.ceil(dMax / 60) * 60);
      if (rmEnd <= rmStart) rmEnd = rmStart + 60;
      const mspan = rmEnd - rmStart;
      const mpct = min => ((min - rmStart) / mspan) * 100;
      const hLabel = min => String(Math.floor(min / 60)).padStart(2,'0') + ':' + String(Math.round(min % 60)).padStart(2,'0');

      let mticks = '';
      for (let m = rmStart; m <= rmEnd; m += 60){
        mticks += `<div class="tk-tl-tick" style="left:${mpct(m)}%"><span>${hLabel(m)}</span></div>`;
      }

      const todayKey = startOfDay(new Date()).getTime();
      const nowMin = (Date.now() - todayKey) / MIN;
      const nowMarker = (nowMin >= rmStart && nowMin <= rmEnd)
        ? `<div class="tk-tl-now" style="left:${mpct(nowMin)}%" title="now"></div>` : '';
      const dayRows = dayKeys.map(dk => {
        const segs = segsByDay[dk];
        const totalSec = segs.reduce((s, seg) => s + (seg.endMin - seg.startMin) * 60, 0);
        const ld = new Date(dk); // build "Wed 12" explicitly so weekday leads regardless of locale order
        const label = ld.toLocaleDateString(undefined, { weekday: 'short' }) + ' ' + ld.getDate();
        const blocks = segs.map(seg => {
          const p = projects.find(pr => pr.id === seg.projectId);
          const t = tasks.find(tk => tk.id === seg.taskId);
          const tip = (p ? p.name : '(project)') + ' · ' + (t ? t.name : '(task)') + ' · ' + hLabel(seg.startMin) + '–' + hLabel(seg.endMin) + ' (' + fmtHM((seg.endMin - seg.startMin) * 60) + ')';
          const w = Math.max(mpct(seg.endMin) - mpct(seg.startMin), 0.4);
          return `<div class="tk-tl-block" style="left:${mpct(seg.startMin)}%;width:${w}%;background:${p ? p.color : '#888'}" title="${escapeHtml(tip)}"></div>`;
        }).join('');
        return `<div class="tk-tl-row">
          <div class="tk-tl-label"><span class="tk-tl-name">${escapeHtml(label)}</span><span class="tk-tl-total">${fmtHM(totalSec)}</span></div>
          <div class="tk-tl-track">${blocks}${dk === todayKey ? nowMarker : ''}</div>
        </div>`;
      }).join('');

      multiDay = `<div class="tk-tl">
        ${dayRows}
        <div class="tk-tl-row tk-tl-axis"><div class="tk-tl-label"></div><div class="tk-tl-track">${mticks}</div></div>
      </div>`;
    }

    // --- Month calendar (each day coloured by the projects worked that day) ---
    const calBase = startOfMonth(new Date());
    calBase.setMonth(calBase.getMonth() + calMonthOffset);
    const calYear = calBase.getFullYear(), calMon = calBase.getMonth();
    const calLabel = calBase.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    // seconds per project per local day-key within the shown month
    const monthSecByDayProject = {}; // 'YYYY-M-D' -> { projectId: sec }
    function calAdd(dayKey, projectId, sec){
      (monthSecByDayProject[dayKey] = monthSecByDayProject[dayKey] || {});
      monthSecByDayProject[dayKey][projectId] = (monthSecByDayProject[dayKey][projectId] || 0) + sec;
    }
    function dayKeyOf(d){ return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
    entries.forEach(e => {
      const d = new Date(e.start);
      if (d.getFullYear() === calYear && d.getMonth() === calMon) calAdd(dayKeyOf(d), e.projectId, durationOf(e));
    });
    if (activeTimer){
      const d = new Date(activeTimer.start);
      if (d.getFullYear() === calYear && d.getMonth() === calMon) calAdd(dayKeyOf(d), activeTimer.projectId, (Date.now() - d) / 1000);
    }
    const projName = id => { const p = projects.find(pr => pr.id === id); return p ? p.name : '(deleted)'; };
    const projColor = id => { const p = projects.find(pr => pr.id === id); return p ? p.color : '#888'; };
    // grid runs Monday..Sunday, from the Monday on/before the 1st to fill full weeks
    const first = new Date(calYear, calMon, 1);
    const gridStart = new Date(first); gridStart.setDate(1 - ((first.getDay() + 6) % 7));
    const todayKey = dayKeyOf(new Date());
    const weekdayHead = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w => `<div class="tk-cal-wd">${w}</div>`).join('');
    let calCells = '';
    for (let i = 0; i < 42; i++){
      const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
      const inMonth = d.getMonth() === calMon;
      const key = dayKeyOf(d);
      const byProj = monthSecByDayProject[key];
      let bar = '', total = 0, tip = '';
      if (byProj){
        const parts = Object.entries(byProj).sort((a,b) => b[1]-a[1]);
        total = parts.reduce((s, [,v]) => s + v, 0);
        bar = parts.map(([pid, sec]) => `<span style="flex:${sec};background:${projColor(pid)}"></span>`).join('');
        tip = parts.map(([pid, sec]) => projName(pid) + ' ' + fmtHM(sec)).join(' · ');
      }
      calCells += `<div class="tk-cal-cell${inMonth?'':' out'}${key===todayKey?' today':''}"${tip?` title="${escapeHtml(tip)}"`:''}>
        <div class="tk-cal-top"><span class="tk-cal-num">${d.getDate()}</span>${byProj ? `<span class="tk-cal-hrs">${fmtHM(total)}</span>` : ''}</div>
        ${byProj ? `<span class="tk-cal-bar">${bar}</span>` : ''}
      </div>`;
    }
    const calLegend = projects.filter(p => Object.values(monthSecByDayProject).some(bp => bp[p.id]))
      .map(p => `<span class="tk-cal-leg"><span class="tk-dot tk-dot-sm" style="background:${p.color}"></span>${escapeHtml(p.name)}</span>`).join('');
    const calendar = `<div class="tk-cal-grid">${weekdayHead}${calCells}</div>` +
      (calLegend ? `<div class="tk-cal-legend">${calLegend}</div>` : '');

    // --- Split-by-project bar chart ---
    const chartEntries = entriesForPeriod(chartPeriod);
    const totalsByProject = {};
    let maxTotal = 0;
    chartEntries.forEach(e => {
      totalsByProject[e.projectId] = (totalsByProject[e.projectId]||0) + durationOf(e);
    });
    if (activeTimer) {
      const live = (Date.now() - new Date(activeTimer.start))/1000;
      totalsByProject[activeTimer.projectId] = (totalsByProject[activeTimer.projectId]||0) + live;
    }
    Object.values(totalsByProject).forEach(v => { if (v > maxTotal) maxTotal = v; });

    const chartProjects = projects.filter(p => totalsByProject[p.id]).sort((a,b)=> (totalsByProject[b.id]||0)-(totalsByProject[a.id]||0));
    const grandTotal = chartProjects.reduce((s,p) => s + totalsByProject[p.id], 0);

    const barRows = chartProjects.map(p => {
      const val = totalsByProject[p.id] || 0;
      const pct = maxTotal ? (val/maxTotal*100) : 0;
      const share = grandTotal ? Math.round(val/grandTotal*100) : 0;
      return `<div class="tk-bar-row">
        <div class="tk-bar-label"><span class="tk-dot" style="background:${p.color}"></span>${escapeHtml(p.name)}</div>
        <div class="tk-bar-track"><div class="tk-bar-fill" style="width:${pct}%;background:${p.color}"></div></div>
        <div class="tk-bar-val">${fmtHM(val)} · ${share}%</div>
      </div>`;
    }).join('') || `<div class="tk-empty">No time logged for this period yet.</div>`;

    // donut (inline SVG, no chart library) + legend
    const R = 52, CIRC = 2 * Math.PI * R;
    let cumFrac = 0;
    const donutArcs = chartProjects.map(p => {
      const frac = grandTotal ? totalsByProject[p.id]/grandTotal : 0;
      const dash = frac * CIRC;
      const arc = `<circle cx="66" cy="66" r="${R}" fill="none" stroke="${p.color}" stroke-width="20"
        stroke-dasharray="${dash} ${CIRC - dash}" stroke-dashoffset="${-cumFrac * CIRC}"></circle>`;
      cumFrac += frac;
      return arc;
    }).join('');
    const donutLegend = chartProjects.map(p => {
      const val = totalsByProject[p.id] || 0;
      const pct = grandTotal ? Math.round(val/grandTotal*100) : 0;
      return `<div class="tk-legend-row">
        <span class="tk-bar-label"><span class="tk-dot" style="background:${p.color}"></span>${escapeHtml(p.name)}</span>
        <span class="tk-bar-val">${fmtHM(val)} · ${pct}%</span>
      </div>`;
    }).join('');
    const pieChart = chartProjects.length ? `
      <div class="tk-pie-wrap">
        <svg class="tk-pie" viewBox="0 0 132 132">${donutArcs}</svg>
        <div class="tk-legend">${donutLegend}</div>
      </div>` : `<div class="tk-empty">No time logged for this period yet.</div>`;

    // --- Log ---
    const sortedEntries = [...entries].sort((a,b) => new Date(b.start) - new Date(a.start)).slice(0, 25);
    const logRows = sortedEntries.length ? sortedEntries.map(e => {
      const p = projects.find(pr => pr.id === e.projectId);
      const t = tasks.find(tk => tk.id === e.taskId);
      const s = new Date(e.start), en = new Date(e.end);
      const label = [p ? escapeHtml(p.name) : '(deleted project)', t ? escapeHtml(t.name) : '(deleted task)'].join(' · ');
      if (editingEntryId === e.id){
        return `<div class="tk-log-edit" data-edit-row="${e.id}">
          <div class="tk-log-proj">${label}</div>
          <div class="tk-edit-fields">
            <input class="tk-input" type="date" data-ef="date" value="${fmtDateInput(s)}"/>
            <input class="tk-input" type="time" data-ef="start" value="${fmtTimeInput(s)}"/>
            <input class="tk-input" type="time" data-ef="end" value="${fmtTimeInput(en)}"/>
            <input class="tk-input" data-ef="note" placeholder="Note (optional)" value="${escapeHtml(e.note||'')}"/>
            <button class="tk-btn tk-btn-start tk-btn-small" data-save-entry="${e.id}">Save</button>
            <button class="tk-btn tk-btn-ghost tk-btn-small" data-cancel-entry="1">Cancel</button>
          </div>
        </div>`;
      }
      return `<div class="tk-log-row">
        <span class="tk-dot" style="background:${p?p.color:'#ccc'}"></span>
        <div class="tk-log-proj">${label}${e.note ? `<span class="tk-log-note">${escapeHtml(e.note)}</span>` : ''}</div>
        <div class="tk-log-date">${s.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${s.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false})}</div>
        <div class="tk-log-dur">${fmtHM(durationOf(e))}</div>
        <button class="tk-log-del" data-edit-entry="${e.id}" title="Edit entry">✎</button>
        <button class="tk-log-del" data-del-entry="${e.id}" title="Delete entry">✕</button>
      </div>`;
    }).join('') : `<div class="tk-empty">No entries yet. Track a task or add one manually below.</div>`;

    // manual-entry form dropdowns
    if (manualProjectId === null || !projects.some(p => p.id === manualProjectId)) manualProjectId = projects.length ? projects[0].id : null;
    const projectOptions = projects.map(p => `<option value="${p.id}" ${p.id===manualProjectId?'selected':''}>${escapeHtml(p.name)}</option>`).join('');
    const taskOptions = tasks.filter(t => t.projectId === manualProjectId).map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');

    root.innerHTML = `
      <div class="tk-wrap">
        <div class="tk-header">
          <div class="tk-word">Time<span>keeper</span></div>
          <div class="tk-header-right">
            <div class="tk-date">${dateStr}</div>
            <button class="tk-theme-btn" id="tk-theme-btn" title="${theme==='dark'?'Switch to light mode':'Switch to dark mode'}">${theme==='dark'?'☀':'☾'}</button>
          </div>
        </div>

        <div class="tk-panel">
          <h2>Current session</h2>
          <div class="tk-timer-row">
            <div class="tk-dial-box">
              <svg viewBox="0 0 132 132">
                <circle class="tk-dial-track" cx="66" cy="66" r="58"></circle>
                <circle id="tk-dial-progress" class="tk-dial-progress" cx="66" cy="66" r="58"
                  stroke-dasharray="${circumference}" stroke-dashoffset="${dialOffset}"></circle>
              </svg>
              <div id="tk-dial-readout" class="tk-dial-readout">${fmtHMS(elapsed)}</div>
              <div id="tk-dial-hours" class="tk-dial-hours" title="${doneHours ? doneHours + ' h this session' : ''}">${pipsHtml}</div>
            </div>
            <div class="tk-timer-controls">
              ${activeTimer
                ? `${nowTaskHtml}
                   <button class="tk-btn tk-btn-stop" id="tk-stop-btn">Stop tracking</button>
                   <span class="tk-kbd-hint">or press Esc</span>`
                : `<div class="tk-empty">Not tracking. Press <strong>Start</strong> on any task below.</div>
                   ${resume ? `<button class="tk-btn tk-btn-start tk-btn-small" id="tk-resume-btn" style="margin-top:10px;">▶ Resume ${escapeHtml(resumeName)}</button>` : ''}`}
              ${gaugeHtml}
            </div>
            ${activeTimer ? `<img class="tk-cat" src="${CAT_IMG}" alt="working cat" title="oh lawd he workin"/>` : ''}
          </div>
        </div>

        <div class="tk-panel">
          <div class="tk-panel-head">
            <h2>Projects &amp; tasks</h2>
          </div>
          <div class="tk-add-row" style="margin-bottom:14px;">
            <label class="tk-dot-pick" title="Pick colour">
              <span class="tk-dot" id="tk-new-project-swatch" style="background:${nextColor()}"></span>
              <input type="color" id="tk-new-project-color" value="${nextColor()}"/>
            </label>
            <input class="tk-input" id="tk-new-project" placeholder="New project name"/>
            <button class="tk-btn tk-btn-ghost tk-btn-small" id="tk-add-project-btn">Add project</button>
          </div>
          ${projectCards}
        </div>

        <div class="tk-panel">
          <div class="tk-panel-head">
            <h2>Today</h2>
            <div class="tk-day-stats">Today <b>${fmtHM(todayTotalSec)}</b> · This week <b>${fmtHM(weekTotalSec)}</b> · This month <b>${fmtHM(monthTotalSec)}</b></div>
          </div>
          <div class="tk-target-row">
            <label class="tk-target-label">Daily target (h)
              <input class="tk-input tk-target-input" type="number" min="0" step="0.5" id="tk-daily-target" value="${dailyTargetHours || ''}" placeholder="—"/>
            </label>
            ${targetSec ? '' : `<span class="tk-empty">Set a target to track daily progress.</span>`}
          </div>
          ${todaySummary}
        </div>

        <div class="tk-panel">
          <h2>Today's timeline</h2>
          ${timeline}
        </div>

        <div class="tk-panel">
          <div class="tk-panel-head">
            <h2>Recent days</h2>
            <div class="tk-tabs">
              <div class="tk-tab ${daysRange==='week'?'active':''}" data-days="week">This week</div>
              <div class="tk-tab ${daysRange===7?'active':''}" data-days="7">7 days</div>
              <div class="tk-tab ${daysRange===14?'active':''}" data-days="14">14 days</div>
              <div class="tk-tab ${daysRange===30?'active':''}" data-days="30">30 days</div>
            </div>
          </div>
          ${multiDay}
        </div>

        <div class="tk-panel">
          <div class="tk-panel-head">
            <h2>Calendar</h2>
            <div class="tk-cal-nav">
              <button class="tk-icon-btn" id="tk-cal-prev" title="Previous month">◀</button>
              <span class="tk-cal-label">${calLabel}</span>
              <button class="tk-icon-btn" id="tk-cal-next" title="Next month" ${calMonthOffset>=0?'disabled':''}>▶</button>
            </div>
          </div>
          ${calendar}
        </div>

        <div class="tk-panel">
          <div class="tk-panel-head">
            <h2>Split by project</h2>
            <div class="tk-chart-controls">
              <label class="tk-pie-toggle"><input type="checkbox" id="tk-pie-toggle" ${chartType==='pie'?'checked':''}/> Pie</label>
              <div class="tk-tabs">
                <div class="tk-tab ${chartPeriod==='today'?'active':''}" data-period="today">Today</div>
                <div class="tk-tab ${chartPeriod==='week'?'active':''}" data-period="week">This week</div>
                <div class="tk-tab ${chartPeriod==='month'?'active':''}" data-period="month">This month</div>
                <div class="tk-tab ${chartPeriod==='all'?'active':''}" data-period="all">All time</div>
              </div>
            </div>
          </div>
          ${chartType==='pie' ? pieChart : barRows}
        </div>

        <div class="tk-panel">
          <div class="tk-panel-head">
            <h2><button class="tk-caret" id="tk-log-toggle" title="${logCollapsed?'Expand':'Collapse'}">${logCollapsed?'▸':'▾'}</button>Log${logCollapsed && entries.length ? ` <span class="tk-count">${entries.length}</span>` : ''}</h2>
            ${logCollapsed ? '' : `<button class="tk-manual-toggle" id="tk-manual-toggle">${manualFormOpen ? 'Cancel' : '+ Add manual entry'}</button>`}
          </div>
          ${logCollapsed ? '' : `
          ${manualFormOpen ? `
          <div class="tk-manual-form">
            <div>
              <label>Project</label>
              <select class="tk-input" id="tk-manual-project">${projectOptions}</select>
            </div>
            <div>
              <label>Task</label>
              <select class="tk-input" id="tk-manual-task">${taskOptions}</select>
            </div>
            <div>
              <label>Date</label>
              <input class="tk-input" type="date" id="tk-manual-date" value="${manualPrefill ? manualPrefill.date : fmtDateInput(new Date())}"/>
            </div>
            <div>
              <label>Start</label>
              <input class="tk-input" type="time" id="tk-manual-start" value="${manualPrefill ? manualPrefill.start : ''}"/>
            </div>
            <div>
              <label>End</label>
              <input class="tk-input" type="time" id="tk-manual-end" value="${manualPrefill ? manualPrefill.end : fmtTimeInput(new Date())}"/>
            </div>
            <div style="grid-column:1/-1;">
              <label>Note (optional)</label>
              <input class="tk-input" id="tk-manual-note" placeholder="What was this?"/>
            </div>
            <div style="align-self:end;">
              <button class="tk-btn tk-btn-start tk-btn-small" id="tk-manual-save" style="width:100%;">Save entry</button>
            </div>
          </div>` : ''}
          <div style="margin-top: ${manualFormOpen ? '16px' : '2px'};">
            ${logRows}
          </div>`}
        </div>

        <div class="tk-panel tk-backup">
          <div class="tk-panel-head">
            <h2>Backup</h2>
            <span class="tk-backup-age ${backupAge().stale?'stale':''}">${backupAge().text}</span>
          </div>
          <div class="tk-backup-row">
            <button class="tk-btn tk-btn-ghost tk-btn-small" id="tk-export-btn">Export backup (JSON)</button>
            <button class="tk-btn tk-btn-ghost tk-btn-small" id="tk-csv-btn">Export CSV (spreadsheet)</button>
            <button class="tk-btn tk-btn-ghost tk-btn-small" id="tk-import-btn">Import backup…</button>
            <input type="file" accept="application/json,.json" id="tk-import-file" style="display:none"/>
          </div>
          <div class="tk-empty" style="margin-top:8px;">Your data lives only in this browser. Export regularly so you don't lose it. JSON restores everything; CSV is for spreadsheets.</div>
          <details class="tk-explain">
            <summary>Where is my data saved?</summary>
            <p>Nothing is sent anywhere. Everything is stored in this browser's
            <strong>localStorage</strong> — a small store the browser keeps on your
            computer — and is read back automatically each time you open the app, so
            you don't need a backup for day-to-day use.</p>
            <p>Because of that, the data is tied to:</p>
            <ul>
              <li><strong>This browser</strong> — data saved in one browser isn't visible in another. Open the app in the same browser each time.</li>
              <li><strong>This file's location</strong> — if you move or rename the app file, or open it from a different path, the browser treats it as a new site and shows an empty list.</li>
              <li><strong>Your browser data</strong> — clearing "cookies and site data", or using private/incognito mode, erases it.</li>
            </ul>
            <p>The <strong>Export</strong> buttons above are your safety net: a portable
            copy you can re-import into any browser or after a reset.</p>
          </details>
        </div>

        <div class="tk-footnote">Everything here stays on this computer — nothing is sent anywhere else.<br>Cat mascot “Le Chaton Fat” by Mistral AI.</div>
      </div>
    `;

    // wire events
    const stopBtn = document.getElementById('tk-stop-btn');
    if (stopBtn) stopBtn.addEventListener('click', () => stopTimer());

    const themeBtn = document.getElementById('tk-theme-btn');
    if (themeBtn) themeBtn.addEventListener('click', toggleTheme);

    // click the working cat -> one-shot hop, then back to the idle sway
    const cat = root.querySelector('.tk-cat');
    if (cat){
      cat.addEventListener('click', () => {
        cat.classList.remove('jumping');
        void cat.offsetWidth; // restart the animation even on rapid clicks
        cat.classList.add('jumping');
      });
      // finite hop ends -> drop the class so the infinite sway takes over again
      cat.addEventListener('animationend', () => cat.classList.remove('jumping'));
    }

    root.querySelectorAll('[data-start-task]:not([data-stop-task])').forEach(el => {
      const proj = el.getAttribute('data-start-project'), task = el.getAttribute('data-start-task');
      if (proj) el.addEventListener('click', () => startTimer(proj, task));
    });
    root.querySelectorAll('[data-stop-task]').forEach(el => el.addEventListener('click', () => stopTimer()));

    const addProjBtn = document.getElementById('tk-add-project-btn');
    const newProjInput = document.getElementById('tk-new-project');
    const newProjColor = document.getElementById('tk-new-project-color');
    const newProjSwatch = document.getElementById('tk-new-project-swatch');
    const doAddProject = () => addProject(newProjInput.value, newProjColor ? newProjColor.value : null);
    if (addProjBtn) addProjBtn.addEventListener('click', doAddProject);
    if (newProjInput) newProjInput.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') doAddProject(); });
    if (newProjColor && newProjSwatch) newProjColor.addEventListener('input', () => { newProjSwatch.style.background = newProjColor.value; });

    root.querySelectorAll('[data-color-project]').forEach(el => {
      el.addEventListener('input', () => { el.previousElementSibling.style.background = el.value; });
      el.addEventListener('change', () => setProjectColor(el.getAttribute('data-color-project'), el.value));
    });

    root.querySelectorAll('[data-add-task]').forEach(btn => {
      const pid = btn.getAttribute('data-add-task');
      const input = root.querySelector('[data-new-task="'+pid+'"]');
      btn.addEventListener('click', () => addTask(pid, input.value));
      if (input) input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') addTask(pid, input.value); });
    });

    root.querySelectorAll('[data-del-project]').forEach(el => el.addEventListener('click', () => deleteProject(el.getAttribute('data-del-project'))));
    root.querySelectorAll('[data-del-task]').forEach(el => el.addEventListener('click', () => deleteTask(el.getAttribute('data-del-task'))));
    root.querySelectorAll('[data-finish-task]').forEach(el => el.addEventListener('click', () => setTaskDone(el.getAttribute('data-finish-task'), true)));
    root.querySelectorAll('[data-reopen-task]').forEach(el => el.addEventListener('click', () => setTaskDone(el.getAttribute('data-reopen-task'), false)));
    root.querySelectorAll('[data-done-group]').forEach(el => el.addEventListener('click', () => toggleDoneGroup(el.getAttribute('data-done-group'))));
    root.querySelectorAll('[data-rename-project]').forEach(el => el.addEventListener('click', () => renameProject(el.getAttribute('data-rename-project'))));
    root.querySelectorAll('[data-rename-task]').forEach(el => el.addEventListener('click', () => renameTask(el.getAttribute('data-rename-task'))));
    root.querySelectorAll('[data-merge-task]').forEach(el => el.addEventListener('click', () => { mergingTaskId = el.getAttribute('data-merge-task'); render(); }));
    root.querySelectorAll('[data-merge-cancel]').forEach(el => el.addEventListener('click', () => { mergingTaskId = null; render(); }));
    root.querySelectorAll('[data-merge-confirm]').forEach(el => el.addEventListener('click', () => {
      const sel = document.getElementById('tk-merge-target');
      if (sel) mergeTask(el.getAttribute('data-merge-confirm'), sel.value);
    }));
    root.querySelectorAll('[data-move-project]').forEach(el => el.addEventListener('click', () => moveProject(el.getAttribute('data-move-project'), parseInt(el.getAttribute('data-dir'),10))));
    root.querySelectorAll('[data-move-task]').forEach(el => el.addEventListener('click', () => moveTask(el.getAttribute('data-move-task'), parseInt(el.getAttribute('data-dir'),10))));
    root.querySelectorAll('[data-collapse]').forEach(el => el.addEventListener('click', () => toggleCollapse(el.getAttribute('data-collapse'))));

    const resumeBtn = document.getElementById('tk-resume-btn');
    if (resumeBtn && resume) resumeBtn.addEventListener('click', () => startTimer(resume.projectId, resume.taskId));

    const targetInput = document.getElementById('tk-daily-target');
    if (targetInput) targetInput.addEventListener('change', () => setDailyTarget(parseFloat(targetInput.value)));

    root.querySelectorAll('[data-edit-entry]').forEach(el => el.addEventListener('click', () => { editingEntryId = el.getAttribute('data-edit-entry'); render(); }));
    root.querySelectorAll('[data-cancel-entry]').forEach(el => el.addEventListener('click', () => { editingEntryId = null; render(); }));
    // click a timeline block to jump straight to editing that entry (unfolds the Log)
    root.querySelectorAll('.tk-tl-block[data-entry]').forEach(el => el.addEventListener('click', () => {
      editingEntryId = el.getAttribute('data-entry');
      if (logCollapsed){ logCollapsed = false; storageSet('tk-log-collapsed', false); }
      render();
      const row = root.querySelector('[data-edit-row="'+editingEntryId+'"]');
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }));
    // drag a block's edge to resize it; the handle swallows the click so it never opens the editor
    root.querySelectorAll('#tk-today-tl .tk-tl-handle').forEach(h => {
      h.addEventListener('click', e => e.stopPropagation());
      h.addEventListener('pointerdown', e => startEdgeDrag(e, h));
    });
    // double-click a gap in a lane to add a manual entry sized to the hole
    root.querySelectorAll('#tk-today-tl .tk-tl-track[data-lane]').forEach(tr => {
      tr.addEventListener('dblclick', e => openHoleEntry(tr, e));
    });
    root.querySelectorAll('[data-save-entry]').forEach(el => el.addEventListener('click', () => {
      const id = el.getAttribute('data-save-entry');
      const row = root.querySelector('[data-edit-row="'+id+'"]');
      const get = k => row.querySelector('[data-ef="'+k+'"]').value;
      updateEntry(id, get('date'), get('start'), get('end'), get('note'));
    }));

    root.querySelectorAll('[data-period]').forEach(el => {
      el.addEventListener('click', () => { chartPeriod = el.getAttribute('data-period'); render(); });
    });
    root.querySelectorAll('[data-days]').forEach(el => {
      el.addEventListener('click', () => { const v = el.getAttribute('data-days'); daysRange = v === 'week' ? 'week' : parseInt(v,10); render(); });
    });
    const calPrev = document.getElementById('tk-cal-prev');
    if (calPrev) calPrev.addEventListener('click', () => shiftMonth(-1));
    const calNext = document.getElementById('tk-cal-next');
    if (calNext) calNext.addEventListener('click', () => shiftMonth(1));
    const pieToggle = document.getElementById('tk-pie-toggle');
    if (pieToggle) pieToggle.addEventListener('change', () => { chartType = pieToggle.checked ? 'pie' : 'bar'; render(); });

    root.querySelectorAll('[data-del-entry]').forEach(el => {
      el.addEventListener('click', () => deleteEntry(el.getAttribute('data-del-entry')));
    });

    const logToggle = document.getElementById('tk-log-toggle');
    if (logToggle) logToggle.addEventListener('click', toggleLog);
    const manualToggle = document.getElementById('tk-manual-toggle');
    if (manualToggle) manualToggle.addEventListener('click', () => { manualFormOpen = !manualFormOpen; manualPrefill = null; render(); });
    const manualProjSel = document.getElementById('tk-manual-project');
    if (manualProjSel) manualProjSel.addEventListener('change', () => { manualProjId(manualProjSel.value); });
    const manualSave = document.getElementById('tk-manual-save');
    if (manualSave) manualSave.addEventListener('click', () => {
      addManualEntry(
        document.getElementById('tk-manual-project').value,
        document.getElementById('tk-manual-task').value,
        document.getElementById('tk-manual-date').value,
        document.getElementById('tk-manual-start').value,
        document.getElementById('tk-manual-end').value,
        document.getElementById('tk-manual-note').value
      );
    });

    const exportBtn = document.getElementById('tk-export-btn');
    if (exportBtn) exportBtn.addEventListener('click', exportData);
    const csvBtn = document.getElementById('tk-csv-btn');
    if (csvBtn) csvBtn.addEventListener('click', exportCSV);
    const importBtn = document.getElementById('tk-import-btn');
    const importFile = document.getElementById('tk-import-file');
    if (importBtn && importFile){
      importBtn.addEventListener('click', () => importFile.click());
      importFile.addEventListener('change', () => { if (importFile.files[0]) importData(importFile.files[0]); });
    }
  }

  function manualProjId(id){ manualProjectId = id; render(); }

  // --- Today's timeline: drag a block edge to adjust its start/end -------------
  // Collision is global (no two activities at once): an edge stops at the nearest
  // other tracked interval in time, across every lane. A neighbour of the SAME
  // activity (project + task) is absorbed instead of blocked — the two merge.
  function startEdgeDrag(ev, handle){
    ev.preventDefault(); ev.stopPropagation();
    const block = handle.parentElement;
    const track = block.parentElement;
    const id = block.getAttribute('data-entry');
    const entry = entries.find(x => x.id === id); if (!entry) return;
    const edge = handle.classList.contains('tk-tl-handle-r') ? 'end' : 'start';
    const rangeStart = +track.dataset.rangeStart, span = +track.dataset.span;
    const rangeEnd = rangeStart + span;
    const trackW = track.getBoundingClientRect().width || 1;
    const MIN = 60000; // 1-minute floor on a block's duration
    const S0 = +block.getAttribute('data-start'), E0 = +block.getAttribute('data-end');
    const pid = block.getAttribute('data-pid'), tid = block.getAttribute('data-tid');
    // every other tracked interval today (logged entries + the running block)
    const occ = [...document.querySelectorAll('#tk-today-tl .tk-tl-block[data-start]')]
      .filter(b => b !== block)
      .map(b => ({ el:b, s:+b.getAttribute('data-start'), e:+b.getAttribute('data-end'),
                   same: b.getAttribute('data-pid') === pid && b.getAttribute('data-tid') === tid }));
    const snap = ms => Math.round(ms / 60000) * 60000;
    const pctOf = ms => ((ms - rangeStart) / span) * 100;
    let curStart = S0, curEnd = E0, mergeTarget = null;
    tlDragging = true;
    block.classList.add('tk-tl-dragging');
    document.body.style.userSelect = 'none';

    function disarm(){ if (mergeTarget){ mergeTarget.el.classList.remove('tk-tl-merge-armed'); block.classList.remove('tk-tl-merge-armed'); mergeTarget = null; } }

    function onMove(e){
      const dms = (e.clientX - ev.clientX) / trackW * span;
      disarm();
      if (edge === 'end'){
        let v = snap(E0 + dms);
        v = Math.max(v, S0 + MIN);
        v = Math.min(v, rangeEnd);
        const R1 = occ.filter(o => o.s >= E0).sort((a,b) => a.s - b.s)[0]; // nearest to the right
        if (R1){
          if (R1.same){ v = Math.min(v, R1.e); if (v >= R1.s) mergeTarget = R1; }
          else { v = Math.min(v, R1.s); }
        }
        curEnd = v;
      } else {
        let v = snap(S0 + dms);
        v = Math.min(v, E0 - MIN);
        v = Math.max(v, rangeStart);
        const L1 = occ.filter(o => o.e <= S0).sort((a,b) => b.e - a.e)[0]; // nearest to the left
        if (L1){
          if (L1.same){ v = Math.max(v, L1.s); if (v <= L1.e) mergeTarget = L1; }
          else { v = Math.max(v, L1.e); }
        }
        curStart = v;
      }
      if (mergeTarget){ mergeTarget.el.classList.add('tk-tl-merge-armed'); block.classList.add('tk-tl-merge-armed'); }
      block.style.left = pctOf(curStart) + '%';
      block.style.width = Math.max(pctOf(curEnd) - pctOf(curStart), 0.5) + '%';
    }
    function onUp(){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.body.style.userSelect = '';
      tlDragging = false;
      let s = curStart, en = curEnd;
      if (mergeTarget){
        s = Math.min(s, mergeTarget.s); en = Math.max(en, mergeTarget.e);
        const other = entries.find(x => x.id === mergeTarget.el.getAttribute('data-entry'));
        if (other && other.id !== entry.id) entries = entries.filter(x => x.id !== other.id);
      }
      entry.start = new Date(s).toISOString();
      entry.end = new Date(en).toISOString();
      storageSet('tk-entries', entries);
      render();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }

  // Double-click empty timeline space -> open the Log's manual form, pre-sized to
  // the surrounding GLOBAL gap (time when nothing is tracked), project = clicked lane.
  function openHoleEntry(track, ev){
    if (ev.target.closest('.tk-tl-block')) return; // clicked a block, not a hole
    const rangeStart = +track.dataset.rangeStart, span = +track.dataset.span;
    const rangeEnd = rangeStart + span;
    const rect = track.getBoundingClientRect();
    const frac = Math.min(Math.max((ev.clientX - rect.left) / rect.width, 0), 1);
    const ms = rangeStart + frac * span;
    const occ = [...document.querySelectorAll('#tk-today-tl .tk-tl-block[data-start]')]
      .map(b => ({ s:+b.getAttribute('data-start'), e:+b.getAttribute('data-end') }));
    if (occ.some(o => ms >= o.s && ms < o.e)) return; // occupied in some lane -> not a global hole
    let gapStart = rangeStart, gapEnd = rangeEnd;
    occ.forEach(o => { if (o.e <= ms && o.e > gapStart) gapStart = o.e; if (o.s >= ms && o.s < gapEnd) gapEnd = o.s; });
    gapStart = Math.round(gapStart / 60000) * 60000; gapEnd = Math.round(gapEnd / 60000) * 60000;
    if (gapEnd - gapStart < 60000) return; // nothing meaningful to fill
    manualPrefill = { projectId: track.getAttribute('data-lane'), date: fmtDateInput(new Date(gapStart)),
                      start: fmtTimeInput(new Date(gapStart)), end: fmtTimeInput(new Date(gapEnd)) };
    manualProjectId = manualPrefill.projectId;
    manualFormOpen = true;
    if (logCollapsed){ logCollapsed = false; storageSet('tk-log-collapsed', false); }
    render();
    const f = root.querySelector('.tk-manual-form');
    if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  loadAll();
})();
</script>
</div>
